<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>DRIPWORKER — 911 Turbo S</title>
<style>
  html, body { margin: 0; background: #000; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
// Deterministic timeline: window.seek(t) draws the frame at time t (seconds).
// Rendered frame-by-frame by render.cjs, so nothing here depends on wall-clock time.

const CFG = Object.assign({
  W: 1080, H: 1350,
  author: 'DRIPWORKER',
  role: 'MOTION DESIGN · AUTOMOTIVE',
  model: '911 TURBO S',
  credit: '',                               // e.g. 'PHOTO: @author'
  specs: [
    { v: 3.7, d: 1, unit: 'L',    label: 'TWIN-TURBO FLAT-SIX' },
    { v: 650, d: 0, unit: 'PS',   label: 'MAX POWER' },
    { v: 800, d: 0, unit: 'NM',   label: 'MAX TORQUE' },
    { v: 2.7, d: 1, unit: 'S',    label: '0–100 KM/H' },
    { v: 330, d: 0, unit: 'KM/H', label: 'TOP SPEED' },
  ],
  beats: { bass: [], impact: [] },
}, window.CFG || {});

const W = CFG.W, H = CFG.H, U = W / 1080, TALL = H / W > 1.5;
const IW = 1075, IH = 1379;                  // source photo coordinate space
const cv = document.getElementById('c');
cv.width = W; cv.height = H;
const ctx = cv.getContext('2d');
ctx.imageSmoothingQuality = 'high';

// ------------------------------------------------------------------ helpers
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
const lerp = (a, b, k) => a + (b - a) * k;
const prog = (t, a, b) => clamp((t - a) / (b - a), 0, 1);
const E = {
  inOut: k => -(Math.cos(Math.PI * k) - 1) / 2,
  out3: k => 1 - Math.pow(1 - k, 3),
  outExpo: k => (k >= 1 ? 1 : 1 - Math.pow(2, -10 * k)),
  in3: k => k * k * k,
};
function mk(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }
function hash(n) { const s = Math.sin(n * 127.1) * 43758.5453; return s - Math.floor(s); }

// Car silhouette in source coordinates (hand-traced), used only as a soft,
// heavily feathered matte for grading and light sweeps, never as a hard cut-out.
const CAR = [[60,650],[150,645],[270,615],[420,603],[540,608],[620,640],[690,705],[760,728],
  [880,758],[960,798],[1010,858],[1046,940],[1050,1060],[1036,1122],[1000,1152],[820,1202],
  [560,1226],[470,1216],[410,1192],[330,1196],[280,1152],[150,962],[90,952],[40,932],[20,850],
  [28,770],[58,700]];

// Points of interest (source coords)
const P = {
  lampNear: [520, 928], lampFar: [945, 830], crest: [862, 940],
  wheel: [350, 1045], wing: [110, 680], car: [540, 915],
};

let img, graded, bright, bgBlur, matte, grain = [];

function buildLayers() {
  const S = img.width / IW;                  // 2 for car_2x.jpg
  const gw = img.width, gh = img.height;

  matte = mk(gw, gh);
  { const m = matte.getContext('2d'); const tmp = mk(gw, gh); const t = tmp.getContext('2d');
    t.fillStyle = '#fff'; t.beginPath();
    CAR.forEach(([x, y], i) => (i ? t.lineTo(x * S, y * S) : t.moveTo(x * S, y * S)));
    t.closePath(); t.fill();
    m.filter = `blur(${26 * S}px)`; m.drawImage(tmp, 0, 0); }

  // Graded plate: crisp contrast, cooler, background pushed down so the car pops.
  graded = mk(gw, gh);
  { const g = graded.getContext('2d');
    g.filter = 'contrast(1.14) saturate(0.78) brightness(0.96)';
    g.drawImage(img, 0, 0); g.filter = 'none';
    // darken everything except the car
    const bgDark = mk(gw, gh); const b = bgDark.getContext('2d');
    b.fillStyle = 'rgba(4,8,12,0.46)'; b.fillRect(0, 0, gw, gh);
    b.globalCompositeOperation = 'destination-out'; b.drawImage(matte, 0, 0);
    g.drawImage(bgDark, 0, 0);
    // sky / top darkening, cool shadows
    const sky = g.createLinearGradient(0, 0, 0, gh * 0.55);
    sky.addColorStop(0, 'rgba(6,14,24,0.72)'); sky.addColorStop(1, 'rgba(6,14,24,0)');
    g.fillStyle = sky; g.fillRect(0, 0, gw, gh);
    g.globalCompositeOperation = 'soft-light';
    g.fillStyle = 'rgba(30,70,90,0.35)'; g.fillRect(0, 0, gw, gh);
    // ground darkening
    g.globalCompositeOperation = 'source-over';
    const gr = g.createLinearGradient(0, gh * 0.8, 0, gh);
    gr.addColorStop(0, 'rgba(0,0,0,0)'); gr.addColorStop(1, 'rgba(0,0,0,0.55)');
    g.fillStyle = gr; g.fillRect(0, 0, gw, gh); }

  // Over-exposed car-only layer for light sweeps across the paint.
  bright = mk(gw, gh);
  { const b = bright.getContext('2d');
    b.filter = 'brightness(1.9) contrast(1.35) saturate(0.4)'; b.drawImage(img, 0, 0); b.filter = 'none';
    b.globalCompositeOperation = 'destination-in'; b.drawImage(matte, 0, 0); }

  // Blurred backdrop for frames where the photo does not cover (9:16 wide shots).
  bgBlur = mk(Math.round(gw / 4), Math.round(gh / 4));
  { const b = bgBlur.getContext('2d'); b.filter = 'blur(10px) brightness(0.45) saturate(0.7)';
    b.drawImage(graded, 0, 0, bgBlur.width, bgBlur.height); }

  for (let i = 0; i < 6; i++) {
    const c = mk(Math.round(W / 2), Math.round(H / 2)); const g = c.getContext('2d');
    const d = g.createImageData(c.width, c.height);
    let s = (i + 1) * 9973;
    for (let p = 0; p < d.data.length; p += 4) {
      s = (s * 16807) % 2147483647; const v = 128 + ((s / 2147483647) - 0.5) * 255;
      d.data[p] = d.data[p + 1] = d.data[p + 2] = v; d.data[p + 3] = 255;
    }
    g.putImageData(d, 0, 0); grain.push(c);
  }
}

// ------------------------------------------------------------------ camera
// z is relative to "fit width": z=1 shows the full photo width.
function camScale(z) { return (W / IW) * z; }
function clampCam(c) {
  const s = camScale(c.z), vw = W / s, vh = H / s;
  c.cx = vw >= IW ? IW / 2 : clamp(c.cx, vw / 2, IW - vw / 2);
  c.cy = vh >= IH ? IH / 2 : clamp(c.cy, vh / 2, IH - vh / 2);
  return c;
}
function toScreen(c, [x, y]) {
  const s = camScale(c.z), r = c.rot || 0;
  const dx = (x - c.cx) * s, dy = (y - c.cy) * s;
  return [W / 2 + dx * Math.cos(r) - dy * Math.sin(r) + (c.ox || 0),
          H / 2 + dx * Math.sin(r) + dy * Math.cos(r) + (c.oy || 0)];
}
function applyCam(g, c) {
  const s = camScale(c.z);
  g.translate(W / 2 + (c.ox || 0), H / 2 + (c.oy || 0));
  g.rotate(c.rot || 0); g.scale(s, s); g.translate(-c.cx, -c.cy);
}

// Shots: [start, end, from{cx,cy,z,rot}, to, ease]
const deg = d => d * Math.PI / 180;
const SHOTS = [
  // intro flash cuts (accelerating into the drop)
  { a: 2.50, b: 2.75, f: { cx: 350, cy: 1045, z: 2.6 }, t: { cx: 350, cy: 1045, z: 2.75 }, flash: 1 },
  { a: 2.75, b: 3.00, f: { cx: 862, cy: 940, z: 3.4 }, t: { cx: 862, cy: 940, z: 3.6 }, flash: 1 },
  { a: 3.00, b: 3.25, f: { cx: 520, cy: 928, z: 3.0 }, t: { cx: 520, cy: 928, z: 3.2 }, flash: 1 },
  { a: 3.25, b: 3.50, f: { cx: 160, cy: 700, z: 2.6 }, t: { cx: 160, cy: 700, z: 2.8 }, flash: 1 },
  { a: 3.50, b: 3.75, f: { cx: 560, cy: 900, z: 1.25 }, t: { cx: 560, cy: 900, z: 1.32 }, flash: 1 },
  // drop: reveal
  { a: 4.0, b: 4.9, f: { cx: 560, cy: 930, z: 1.75 }, t: { cx: 545, cy: 880, z: 1.0 }, e: E.outExpo },
  { a: 4.9, b: 8.0, f: { cx: 545, cy: 880, z: 1.0 }, t: { cx: 560, cy: 905, z: 1.08 }, e: E.inOut },
  // details
  { a: 8.0, b: 12.0, f: { cx: 470, cy: 925, z: 3.0 }, t: { cx: 575, cy: 935, z: 3.15 }, e: E.inOut, whip: [1, 0] },
  { a: 12.0, b: 16.0, f: { cx: 345, cy: 1050, z: 2.45, rot: deg(-2.2) }, t: { cx: 365, cy: 1020, z: 2.75, rot: deg(0.4) }, e: E.inOut, whip: [-1, 0] },
  { a: 16.0, b: 18.0, f: { cx: 862, cy: 940, z: 3.3 }, t: { cx: 860, cy: 938, z: 3.75 }, e: E.inOut, whip: [0, 1] },
  { a: 18.0, b: 20.0, f: { cx: 160, cy: 660, z: 2.55 }, t: { cx: 160, cy: 760, z: 2.65 }, e: E.inOut, whip: [-1, 0] },
  // specs
  { a: 20.0, b: 28.0, f: { cx: 560, cy: 885, z: 1.12 }, t: { cx: 575, cy: 900, z: 1.22 }, e: E.inOut },
  // outro
  { a: 28.0, b: 34.0, f: { cx: 690, cy: 960, z: 1.45 }, t: { cx: 700, cy: 965, z: 1.8 }, e: E.out3 },
];

function shotAt(t) { for (const s of SHOTS) if (t >= s.a && t < s.b) return s; return null; }
function camOf(s, t) {
  const k = (s.e || (x => x))(prog(t, s.a, s.b));
  return { cx: lerp(s.f.cx, s.t.cx, k), cy: lerp(s.f.cy, s.t.cy, k), z: lerp(s.f.z, s.t.z, k),
           rot: lerp(s.f.rot || 0, s.t.rot || 0, k) };
}

function bassPulse(t) {
  let p = 0;
  for (const tb of CFG.beats.bass) if (t >= tb && t < tb + 0.6) p = Math.max(p, Math.exp(-(t - tb) / 0.11));
  return p;
}
function impactAt(t) {
  let p = 0;
  for (const ti of CFG.beats.impact) if (t >= ti && t < ti + 1.2) p = Math.max(p, Math.exp(-(t - ti) / 0.22));
  return p;
}

// ------------------------------------------------------------------ drawing
const edge = mk(W, H), ectx = edge.getContext('2d');
function drawPlate(g, c, layer, alpha = 1) {
  const s = camScale(c.z);
  if (W / s > IW || H / s > IH) {            // not covering: blurred backdrop + feathered photo edges
    if (layer === graded) {
      g.save(); g.globalAlpha = alpha;
      const k = Math.max(W / bgBlur.width, H / bgBlur.height) * 1.08;
      g.drawImage(bgBlur, (W - bgBlur.width * k) / 2, (H - bgBlur.height * k) / 2, bgBlur.width * k, bgBlur.height * k);
      g.restore();
    }
    ectx.globalCompositeOperation = 'source-over'; ectx.clearRect(0, 0, W, H);
    ectx.save(); applyCam(ectx, c); ectx.drawImage(layer, 0, 0, IW, IH); ectx.restore();
    const y0 = toScreen(c, [c.cx, 0])[1], y1 = toScreen(c, [c.cx, IH])[1], f = 140 * U;
    const gr = ectx.createLinearGradient(0, y0, 0, y1), span = y1 - y0;
    gr.addColorStop(0, 'rgba(0,0,0,0)'); gr.addColorStop(clamp(f / span, 0, 0.5), 'rgba(0,0,0,1)');
    gr.addColorStop(clamp(1 - f / span, 0.5, 1), 'rgba(0,0,0,1)'); gr.addColorStop(1, 'rgba(0,0,0,0)');
    ectx.globalCompositeOperation = 'destination-in'; ectx.fillStyle = gr; ectx.fillRect(0, 0, W, H);
    g.save(); g.globalAlpha = alpha; g.drawImage(edge, 0, 0); g.restore();
    return;
  }
  g.save(); g.globalAlpha = alpha; applyCam(g, c);
  g.drawImage(layer, 0, 0, IW, IH); g.restore();
}

const fx = mk(W, H), fctx = fx.getContext('2d');
function sweep(c, k, angle = deg(18), width = 0.16, strength = 0.75) {
  if (k <= 0 || k >= 1) return;
  fctx.globalCompositeOperation = 'source-over';
  fctx.clearRect(0, 0, W, H); drawPlate(fctx, c, bright);
  const L = Math.hypot(W, H), ca = Math.cos(angle), sa = Math.sin(angle);
  const pos = lerp(-0.3, 1.3, E.inOut(k));
  const x0 = W / 2 - ca * L / 2, y0 = H / 2 - sa * L / 2, x1 = W / 2 + ca * L / 2, y1 = H / 2 + sa * L / 2;
  const gr = fctx.createLinearGradient(x0, y0, x1, y1);
  const a = clamp(pos - width, 0, 1), m = clamp(pos, 0, 1), b = clamp(pos + width, 0, 1);
  gr.addColorStop(0, 'rgba(0,0,0,0)'); gr.addColorStop(a, 'rgba(0,0,0,0)');
  gr.addColorStop(m, 'rgba(0,0,0,1)'); gr.addColorStop(b, 'rgba(0,0,0,0)'); gr.addColorStop(1, 'rgba(0,0,0,0)');
  fctx.globalCompositeOperation = 'destination-in'; fctx.fillStyle = gr; fctx.fillRect(0, 0, W, H);
  ctx.save(); ctx.globalCompositeOperation = 'screen'; ctx.globalAlpha = strength * Math.sin(Math.PI * k);
  ctx.drawImage(fx, 0, 0); ctx.restore();
}

function flare(x, y, intensity, size = 1, tint = [170, 205, 255]) {
  if (intensity <= 0.001) return;
  const [r, g, b] = tint;
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  // anamorphic streak
  ctx.save(); ctx.translate(x, y); ctx.scale(9 * size, 0.09 * size);
  let gr = ctx.createRadialGradient(0, 0, 0, 0, 0, 90 * U);
  gr.addColorStop(0, `rgba(${r},${g},${b},${0.55 * intensity})`); gr.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = gr; ctx.fillRect(-90 * U, -90 * U, 180 * U, 180 * U); ctx.restore();
  // core glow
  gr = ctx.createRadialGradient(x, y, 0, x, y, 120 * U * size);
  gr.addColorStop(0, `rgba(255,255,255,${0.75 * intensity})`);
  gr.addColorStop(0.15, `rgba(${r},${g},${b},${0.35 * intensity})`); gr.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = gr; ctx.fillRect(x - 130 * U * size, y - 130 * U * size, 260 * U * size, 260 * U * size);
  ctx.restore();
}

function fill(color, alpha, op = 'source-over') {
  if (alpha <= 0.001) return;
  ctx.save(); ctx.globalCompositeOperation = op; ctx.globalAlpha = clamp(alpha, 0, 1);
  ctx.fillStyle = color; ctx.fillRect(0, 0, W, H); ctx.restore();
}

function vignette(strength = 0.7) {
  const gr = ctx.createRadialGradient(W / 2, H * 0.52, Math.min(W, H) * 0.35, W / 2, H * 0.52, Math.hypot(W, H) * 0.62);
  gr.addColorStop(0, 'rgba(0,0,0,0)'); gr.addColorStop(1, `rgba(0,0,0,${strength})`);
  ctx.fillStyle = gr; ctx.fillRect(0, 0, W, H);
}

// ------------------------------------------------------------------ type
const F = { mono: 'JetBrains Mono' };
function text(str, x, y, o) {
  ctx.save();
  ctx.font = `${o.weight || 300} ${o.size * U}px "${o.family || 'Inter Display'}"`;
  ctx.letterSpacing = `${(o.track || 0) * U}px`;
  ctx.textAlign = o.align || 'left'; ctx.textBaseline = o.base || 'alphabetic';
  ctx.globalAlpha = clamp(o.alpha ?? 1, 0, 1);
  ctx.fillStyle = o.color || '#f2f4f5';
  if (o.glow) { ctx.shadowColor = 'rgba(160,200,255,0.55)'; ctx.shadowBlur = o.glow * U; }
  ctx.fillText(str, x, y); const w = ctx.measureText(str).width; ctx.restore(); return w;
}
function measure(str, o) {
  ctx.save(); ctx.font = `${o.weight || 300} ${o.size * U}px "${o.family || 'Inter Display'}"`;
  ctx.letterSpacing = `${(o.track || 0) * U}px`; const w = ctx.measureText(str).width; ctx.restore(); return w;
}
// Per-character stagger reveal (fade + rise), centered or left aligned.
function staggerText(str, x, y, o, t, t0, per = 0.04, dur = 0.5, out = null) {
  const total = measure(str, o);
  let cx = o.align === 'center' ? x - total / 2 : x;
  const oo = Object.assign({}, o, { align: 'left' });
  for (let i = 0; i < str.length; i++) {
    const ch = str[i];
    const k = E.out3(prog(t, t0 + i * per, t0 + i * per + dur));
    let a = k * (o.alpha ?? 1);
    if (out) a *= 1 - prog(t, out[0] + i * per * 0.5, out[1] + i * per * 0.5);
    const w = measure(ch, oo);
    if (a > 0.001) text(ch, cx, y + (1 - k) * 24 * U, Object.assign({}, oo, { alpha: a }));
    cx += w;
  }
}
function line(x0, y0, x1, y1, k, alpha = 0.7, wdt = 1.5) {
  if (k <= 0) return;
  ctx.save(); ctx.strokeStyle = `rgba(242,244,245,${alpha})`; ctx.lineWidth = wdt * U;
  ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(lerp(x0, x1, k), lerp(y0, y1, k)); ctx.stroke(); ctx.restore();
}
function topShade(alpha, frac = 0.42) {
  if (alpha <= 0) return;
  const gr = ctx.createLinearGradient(0, 0, 0, H * frac);
  gr.addColorStop(0, `rgba(0,0,0,${0.75 * alpha})`); gr.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = gr; ctx.fillRect(0, 0, W, H * frac);
}
function bottomShade(alpha, frac = 0.35) {
  if (alpha <= 0) return;
  const gr = ctx.createLinearGradient(0, H * (1 - frac), 0, H);
  gr.addColorStop(0, 'rgba(0,0,0,0)'); gr.addColorStop(1, `rgba(0,0,0,${0.8 * alpha})`);
  ctx.fillStyle = gr; ctx.fillRect(0, H * (1 - frac), W, H * frac);
}

function chapter(t, a, b, num, name) {
  const k = prog(t, a + 0.15, a + 0.7), out = 1 - prog(t, b - 0.35, b - 0.05);
  const al = E.out3(k) * out; if (al <= 0) return;
  const x = 72 * U, y = H - 110 * U;
  bottomShade(al * 0.9);
  line(x, y - 46 * U, x + 64 * U, y - 46 * U, E.out3(k), 0.9 * out, 2);
  text(num, x, y, { family: F.mono, size: 20, weight: 500, track: 4, alpha: al * 0.65 });
  text(name, x + 66 * U, y, { family: F.mono, size: 20, weight: 500, track: 10, alpha: al });
}

// ------------------------------------------------------------------ frame
function frame(t) {
  ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1;
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);

  const s = shotAt(t);
  let c = null;
  if (s) {
    c = clampCam(camOf(s, t));
    // bass bounce + impact shake
    const bp = t >= 4 && t < 30 ? bassPulse(t) : 0;
    c.z *= 1 + 0.014 * bp;
    const ip = impactAt(t);
    c.ox = (hash(t * 97) - 0.5) * 26 * U * ip; c.oy = (hash(t * 131) - 0.5) * 26 * U * ip;

    // whip transitions: directional blur across the cut
    let whip = 0, dir = [0, 0];
    const prev = SHOTS[SHOTS.indexOf(s) - 1];
    const next = SHOTS[SHOTS.indexOf(s) + 1];
    if (s.whip && t - s.a < 0.12) { whip = 1 - (t - s.a) / 0.12; dir = s.whip.map(v => -v); }
    else if (next && next.whip && next.a === s.b && s.b - t < 0.12) { whip = 1 - (s.b - t) / 0.12; dir = next.whip; }
    if (whip > 0) {
      // dense samples spread over a short span -> smooth streak instead of visible ghost copies
      const mag = 360 * U * E.in3(whip), n = 28, spread = 0.18 + 0.5 * whip;
      for (let i = 0; i < n; i++) {
        const f = (i / (n - 1) - 0.5) * 2;
        const cc = Object.assign({}, c, { ox: c.ox + dir[0] * mag * (1 + f * spread), oy: c.oy + dir[1] * mag * (1 + f * spread) });
        drawPlate(ctx, cc, graded, 1 / (i + 1));
      }
    } else {
      drawPlate(ctx, c, graded);
    }

    // intro flash cuts: dim, punchy
    if (s.flash) {
      const k = prog(t, s.a, s.b);
      fill('#000', 0.35 + 0.4 * k);
      fill('#fff', 0.5 * Math.exp(-k * 9), 'screen');
    }

    // ---- per-section light effects
    if (t >= 4.0 && t < 8.0) sweep(c, prog(t, 5.2, 7.2), deg(22), 0.14, 0.55);
    if (t >= 8.0 && t < 12.0) {
      const k = prog(t, 8.9, 10.6);
      const [x, y] = toScreen(c, P.lampNear);
      flare(lerp(x - 260 * U, x + 220 * U, E.inOut(k)), y - 20 * U, Math.sin(Math.PI * k) * 0.9, 1.1);
      sweep(c, prog(t, 9.6, 11.4), deg(-12), 0.12, 0.5);
    }
    if (t >= 12.0 && t < 16.0) sweep(c, prog(t, 12.8, 14.6), deg(28), 0.13, 0.7);
    if (t >= 16.0 && t < 18.0) {
      sweep(c, prog(t, 16.3, 17.5), deg(35), 0.12, 0.7);
      const [x, y] = toScreen(c, P.crest);
      flare(x, y, 0.55 * Math.sin(Math.PI * prog(t, 16.6, 17.6)), 0.6, [255, 215, 170]);
    }
    if (t >= 18.0 && t < 20.0) sweep(c, prog(t, 18.2, 19.6), deg(-25), 0.14, 0.65);
    if (t >= 28.0) {
      sweep(c, prog(t, 28.15, 29.6), deg(15), 0.16, 0.7);
      const k = prog(t, 29.0, 30.6);
      const a1 = toScreen(c, P.lampNear), a2 = toScreen(c, P.lampFar);
      const fi = Math.sin(Math.PI * Math.min(1, k * 1.3)) * 0.85;
      flare(a1[0], a1[1], fi, 1.0); flare(a2[0], a2[1], fi * 0.75, 0.75);
    }

    // exposure: impacts flash + bass breathe
    fill('#fff', 0.55 * ip, 'screen');
    fill('#cfe2ff', 0.045 * bp, 'screen');
  }

  // ---- specs: darken plate
  if (t >= 20 && t < 28) fill('#020507', 0.6 * E.out3(prog(t, 20.05, 20.8)) * (1 - prog(t, 27.4, 27.95)));
  // ---- outro: fade plate to near-black for the logo
  if (t >= 30) fill('#000', 0.86 * E.inOut(prog(t, 30.0, 30.6)));

  vignette(t < 4 ? 0.9 : 0.62);

  // ------------------------------------------------ typography
  // intro
  if (t < 2.6) {
    const out = [2.0, 2.4];
    staggerText(CFG.author, W / 2, H / 2, { family: F.mono, size: 30, weight: 500, track: 16, align: 'center' }, t, 0.35, 0.06, 0.35, out);
    staggerText('PRESENTS', W / 2, H / 2 + 52 * U, { family: F.mono, size: 16, weight: 400, track: 12, align: 'center', alpha: 0.55 }, t, 1.05, 0.03, 0.35, out);
  }

  // title on reveal
  if (t >= 4.4 && t < 8.0) {
    const out = [7.35, 7.8];
    const ty = TALL ? H * 0.2 : H * 0.17;
    topShade(1 - prog(t, 7.5, 8.0), TALL ? 0.4 : 0.45);
    const [num, ...rest] = CFG.model.split(' ');
    staggerText(num, W / 2, ty, { size: 210, weight: 200, track: -2, align: 'center', glow: 30 }, t, 4.55, 0.08, 0.6, out);
    staggerText(rest.join('\u2009'), W / 2, ty + 70 * U, { family: F.mono, size: 30, weight: 500, track: 22, align: 'center' }, t, 5.0, 0.05, 0.45, out);
    const lk = E.out3(prog(t, 5.4, 6.2)) * (1 - prog(t, 7.4, 7.8));
    line(W / 2 - 120 * U * lk, ty + 110 * U, W / 2 + 120 * U * lk, ty + 110 * U, 1, 0.6 * lk, 1.5);
  }

  chapter(t, 8.0, 12.0, '01', 'FACE');
  chapter(t, 12.0, 16.0, '02', 'STANCE');
  chapter(t, 16.0, 18.0, '03', 'CREST');
  chapter(t, 18.0, 20.0, '04', 'AERO');

  // specs
  if (t >= 20.1 && t < 28) {
    const x0 = 96 * U, fade = 1 - prog(t, 27.3, 27.85);
    const top = TALL ? H * 0.2 : 190 * U, step = TALL ? H * 0.12 : 176 * U;
    const hk = E.out3(prog(t, 20.2, 20.9)) * fade;
    text('SPECIFICATION', x0, top, { family: F.mono, size: 18, weight: 500, track: 10, alpha: hk * 0.6 });
    text(CFG.model, W - x0, top, { family: F.mono, size: 18, weight: 500, track: 10, alpha: hk, align: 'right' });
    line(x0, top + 26 * U, W - x0, top + 26 * U, E.out3(prog(t, 20.2, 21.2)), 0.35 * fade, 1);
    CFG.specs.forEach((sp, i) => {
      const t0 = 20.5 + i * 1.0;                        // every 2 beats
      const k = E.out3(prog(t, t0, t0 + 0.55));
      if (k <= 0) return;
      const y = top + 150 * U + i * step;
      const cnt = E.out3(prog(t, t0, t0 + 0.9));
      const v = (sp.v * cnt).toFixed(sp.d);
      const a = k * fade;
      line(x0, y - 100 * U, x0, y + 40 * U, k, 0.5 * fade, 2);
      const big = { size: 116, weight: 200, track: -1, alpha: a, glow: 18 };
      const wv = measure(sp.v.toFixed(sp.d), big);          // fixed width: no jitter while counting
      text(v, x0 + 30 * U, y + (1 - k) * 30 * U, big);
      text(sp.unit, x0 + 30 * U + wv + 16 * U, y + (1 - k) * 30 * U, { family: F.mono, size: 28, weight: 500, track: 4, alpha: a });
      text(sp.label, x0 + 32 * U, y + 40 * U, { family: F.mono, size: 16, weight: 400, track: 8, alpha: a * 0.6 });
    });
  }

  // outro logo
  if (t >= 30.15) {
    const fadeAll = 1 - prog(t, 33.1, 33.95);
    const y = H * 0.5;
    staggerText(CFG.author, W / 2, y, { size: 104, weight: 250, track: 20, align: 'center', glow: 26, alpha: fadeAll }, t, 30.2, 0.055, 0.6);
    const lk = E.out3(prog(t, 30.9, 31.7)) * fadeAll;
    line(W / 2 - 170 * U * lk, y + 42 * U, W / 2 + 170 * U * lk, y + 42 * U, 1, 0.6 * lk, 1.5);
    staggerText(CFG.role, W / 2, y + 92 * U, { family: F.mono, size: 20, weight: 500, track: 10, align: 'center', alpha: 0.75 * fadeAll }, t, 31.1, 0.02, 0.4);
    if (CFG.credit) text(CFG.credit, W / 2, H - 70 * U, { family: F.mono, size: 13, weight: 400, track: 6, align: 'center', alpha: 0.4 * E.out3(prog(t, 31.6, 32.2)) * fadeAll });
  }

  // film grain on top of everything
  ctx.save(); ctx.globalCompositeOperation = 'overlay'; ctx.globalAlpha = 0.11;
  ctx.drawImage(grain[Math.floor(t * 24) % grain.length], 0, 0, W, H); ctx.restore();

  // global fade in/out
  if (t > 33.2) fill('#000', prog(t, 33.2, 34.0));
}

window.seek = t => frame(t);
window.ready = (async () => {
  img = new Image(); img.src = CFG.src || 'car_2x.jpg'; await img.decode();
  await document.fonts.load(`200 100px "Inter Display"`);
  await document.fonts.load(`500 20px "JetBrains Mono"`);
  buildLayers(); frame(0); return true;
})();
</script>
</body>
</html>
